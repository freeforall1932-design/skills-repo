name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # Weekly un-pinned run of the SkillOpt integration job, to surface upstream
  # drift. It is allowed to fail; the pinned run on pull requests is not.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  one-skill:
    name: One skill (generated bundle)
    # The bundle in .claude/skills/, claude-skills/app/ and pseudo-skills/ is the
    # output of one-skill/build.py. This job is what keeps "the repo publishes X"
    # and "the manifest says Y" from drifting apart.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: python -m pip install --upgrade pip pytest

      - name: Test the merge (fidelity, links, budget, determinism)
        run: pytest one-skill/tests -q

      - name: Fail if a published copy is stale
        # `check` rebuilds from the manifest into a temp dir and diffs the result
        # against .claude/skills/, claude-skills/app/ and the paste file. It does not
        # read one-skill/dist/, which is gitignored and so absent here: a gate that
        # trusts a directory that may not exist is a gate that passes on nothing.
        run: |
          python one-skill/build.py check || {
            echo "::error::a published copy of the skill is out of date with one-skill/sources.json."
            echo "::error::Run 'python one-skill/build.py build install' and commit the result."
            exit 1
          }

      - name: Build twice, offline, and prove it settles
        # `build` reads only one-skill/{sources.json,core,upstream}, so a merge is
        # reproducible with no network. Only `sync` may reach it, and only when a
        # maintainer asks. Re-checking after a second build proves the output is a
        # fixed point rather than something that drifts a little per run.
        run: |
          python one-skill/build.py build >/dev/null
          python one-skill/build.py check >/dev/null
          python one-skill/build.py build >/dev/null
          python one-skill/build.py check >/dev/null

  skillopt-tests:
    name: SkillOpt reward function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # These tests exercise the reward function and the dataset only.
      # SkillOpt is NOT installed, so `pytest.importorskip` skips the
      # integration tests and the reward-function tests still run.
      - name: Install package
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e skillopt-integration

      - name: Run tests
        run: pytest skillopt-integration/tests -q

      - name: Score the reference baseline
        run: |
          python -m caveman_skillopt.score \
            --split-dir skillopt-integration/data/caveman_brief_split \
            --split test \
            --predictions skillopt-integration/examples/predictions-good.json \
            --show-violations

  skillopt-integration:
    name: SkillOpt integration
    runs-on: ubuntu-latest
    # Blocking on pull requests and pushes, because the install is pinned and
    # therefore deterministic. The weekly scheduled run installs the latest
    # upstream instead and is allowed to fail, so an upstream breaking change
    # is reported on its own schedule rather than turning unrelated pull
    # requests red.
    #
    # Pinning is what makes blocking safe. An un-pinned blocking job breaks
    # this repository's CI whenever upstream publishes; an un-pinned
    # non-blocking job is neither a gate nor reproducible.
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with SkillOpt
        run: |
          python -m pip install --upgrade pip pytest
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m pip install --upgrade skillopt
          else
            python -m pip install skillopt==0.2.0
          fi
          python -m pip install -e skillopt-integration

      - name: Report resolved versions
        run: |
          python -m pip list 2>/dev/null | grep -i -E '^(skillopt|caveman-skillopt) ' || true

      - name: Run the full suite
        run: pytest skillopt-integration/tests -q

  # `legacy/coding-agents/compile.py` and its tests are not run any more. The
  # per-agent pack build was frozen when the four variants moved under legacy/:
  # the one skill replaces them as the published artifact, and a job that guards
  # frozen history turns every unrelated pull request red for no benefit. The
  # generator still runs locally if someone wants to rebuild those packs.
