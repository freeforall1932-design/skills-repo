# ──────────────────────────────────────────────────────────────
# caveman_brief — default run (all registers mixed)
# ──────────────────────────────────────────────────────────────
# Trains ONE skill document across all four registers. Use this when
# you want a single artifact. If you would rather keep the three
# philosophies separate (they do conflict — see
# legacy/coding-agents/philosophy/conflicts.md), use be-brief.yaml,
# caveman.yaml, grug.yaml or coding-agent.yaml instead.
#
# Run from the repository root:
#   python -m caveman_skillopt.train --config skillopt-integration/configs/default.yaml

_base_: _base_/default.yaml

env:
  name: caveman_brief
  skill_init: skillopt-integration/caveman_skillopt/envs/caveman_brief/skills/initial.md
  split_dir: skillopt-integration/data/caveman_brief_split
  out_root: runs/caveman_brief
  workers: 8
  max_completion_tokens: 4096
  register_filter: ""

train:
  num_epochs: 4
  batch_size: 20
  accumulation: 1

gradient:
  minibatch_size: 8
  merge_batch_size: 8
  analyst_workers: 8

optimizer:
  learning_rate: 4
