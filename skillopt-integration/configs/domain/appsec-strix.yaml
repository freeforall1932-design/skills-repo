# ──────────────────────────────────────────────────────────────
# domain skill: appsec-strix — trained alone, against its own reward only
# ──────────────────────────────────────────────────────────────
# Status: dataset + reward + offline scorer are shipped and run in CI
# (python -m caveman_skillopt.score_domain --skill appsec-strix). Live training
# additionally needs the small `domain_skill` EnvAdapter described step
# by step in skillopt-integration/TRAINING.md; until it is registered this
# config is inert by design. Never point two skills at one run, and never
# average their scores (see TRAINING.md "Why per-skill").

_base_: ../_base_/default.yaml

env:
  name: domain_skill
  skill_filter: appsec-strix
  skill_init: domain-skills/appsec-strix/SKILL.md
  split_dir: skillopt-integration/data/domain/appsec-strix
  out_root: runs/domain/appsec-strix
  workers: 4
  max_completion_tokens: 4096

train:
  num_epochs: 3
  batch_size: 3

optimizer:
  learning_rate: 2
